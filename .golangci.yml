version: "2"
linters:
  default: standard
  enable:
    - fatcontext
    - gocritic
    - intrange
    - importas
    - iface
    - modernize
    - perfsprint
    - sloglint
    - revive
    - tagalign
    - whitespace
    - wsl_v5
    - usestdlibvars
    - exhaustruct_v5
    - gocyclo
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo
