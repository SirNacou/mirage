services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    privileged: true
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy

  dbx:
    image: t8y2/dbx:latest
    pull_policy: always
    volumes:
      - dbx-data:/app/data
    restart: unless-stopped
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mirage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mirage}
      POSTGRES_DB: ${POSTGRES_DB:-mirage}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  dbx-data:
