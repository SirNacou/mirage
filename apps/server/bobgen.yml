psql:
  # Database connection string for Bob to inspect your schema
  dsn: "postgres://mirage:mirage@localhost:5432/mirage?sslmode=disable"
  # Use the pgx/v5 driver wrapper
  driver: "github.com/jackc/pgx/v5/stdlib"
  uuid_pkg: "uuid"
  # Ignore Goose's internal migration tracking table
  except:
    goose_db_version:

plugins_preset: "all" # Valid values are "default", "all" or "none".
plugins:
  dbinfo:
    disabled: false
    pkgname: "dbinfo"
    destination: "internal/db/gen/dbinfo"
  enums:
    disabled: false
    pkgname: "enums"
    destination: "internal/db/gen/enums"
  models:
    disabled: false
    pkgname: "models"
    destination: "internal/db/gen/models"
  factory:
    disabled: false
    pkgname: "factory"
    destination: "internal/db/gen/factory"
  dberrors:
    disabled: false
    pkgname: "dberrors"
    destination: "internal/db/gen/dberrors"
  where:
    disabled: false
  loaders:
    disabled: false
  joins:
    disabled: false
  counts:
    disabled: false
